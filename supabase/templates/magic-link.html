<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>수리온 로그인 인증번호</title>
  </head>
  <body style="margin:0;background:#f5f7fa;font-family:Arial,'Apple SD Gothic Neo',sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e8ef;border-radius:16px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:20px;font-weight:700;color:#1559d6">수리온</p>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.4">로그인 인증번호</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#596579">아래 인증번호를 수리온 화면에 입력해 주세요.</p>
                <p style="margin:0 0 24px;padding:18px;border-radius:12px;background:#f1f6ff;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;color:#1559d6">{{ .Token }}</p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#7a8596">이 번호는 10분 동안 사용할 수 있습니다. 요청하지 않았다면 이 메일을 무시해 주세요.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
